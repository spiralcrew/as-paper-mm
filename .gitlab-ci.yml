# CI/CD: сборка → тесты → бенчмарк → документация (GitLab Pages).
# Запускается на каждый push в любую ветку; Pages публикуется только из ветки по умолчанию.

stages:
  - build
  - test
  - benchmark
  - deploy

default:
  image: ubuntu:24.04
  interruptible: true

variables:
  DEBIAN_FRONTEND: noninteractive
  BUILD_DIR: build

.install_build_tools: &install_build_tools
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build ca-certificates > /dev/null
  - g++ --version | head -1 && cmake --version | head -1

build:
  stage: build
  before_script: *install_build_tools
  script:
    - cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DASMM_WARNINGS_AS_ERRORS=ON
    - cmake --build "$BUILD_DIR" --parallel
  artifacts:
    expire_in: 1 day
    paths:
      - $BUILD_DIR/
    exclude:
      - $BUILD_DIR/_deps/*-src/**/*
      - $BUILD_DIR/_deps/*-subbuild/**/*
      - $BUILD_DIR/**/CMakeFiles/**/*
      - $BUILD_DIR/**/*.a

unit_tests:
  stage: test
  needs: [build]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake > /dev/null
  script:
    - ctest --test-dir "$BUILD_DIR" --output-on-failure --output-junit junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: $BUILD_DIR/junit.xml

replay_smoke:
  stage: test
  needs: [build]
  script:
    # Прогон приложения на записанных 90 секундах BTCUSDT с Binance (paper trading).
    - ./$BUILD_DIR/asmm --input data/sample_btcusdt.jsonl --quiet-fills --report 15

benchmark:
  stage: benchmark
  needs: [build]
  script:
    - ./$BUILD_DIR/bench/asmm_bench --benchmark_min_time=0.5s --benchmark_repetitions=3
      --benchmark_report_aggregates_only=true --benchmark_out=benchmark.json
      --benchmark_out_format=json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - benchmark.json

.doxygen: &doxygen
  - apt-get update -qq && apt-get install -y -qq --no-install-recommends doxygen graphviz > /dev/null
  - doxygen --version
  - doxygen Doxyfile
  - mv build/doxygen/html public

docs:
  stage: deploy
  needs: []
  script: *doxygen
  artifacts:
    expire_in: 1 day
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  needs: []
  script: *doxygen
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
